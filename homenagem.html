<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Feliz Aniversário, Mãe!</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .terminal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .code-line { color: #ff7b72; }
        .string { color: #a5d6ff; }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            font-family: inherit;
            font-weight: bold;
        }
        .btn:hover { background-color: #2ea043; }
        .hidden { display: none; }
        .heart {
            position: fixed;
            top: -10px;
            color: #ff7b72;
            font-size: 20px;
            animation: fall 3s linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="terminal">
    <p><span class="code-line">const</span> mae = <span class="string">"Melhor do Mundo"</span>;</p>
    <p><span class="code-line">if</span> (hoje === <span class="string">"seuAniversario"</span>) {</p>
    <p style="padding-left: 20px;"><span class="code-line">render</span>(<span class="string">"Muitos anos de vida, amor e saude! ❤️"</span>);</p>
    <p>}</p>
    
    <button class="btn" onclick="executarHomenagem()">[ EXECUTAR_AMOR.EXE ]</button>
    
    <div id="resultado" class="hidden" style="margin-top: 20px; color: #7ee787;">
        <h2>Status: 200 OK 🎉</h2>
        <p>Parabéns, Mãe! Você é a nossa desenvolvedora principal e a melhor lógica da minha vida!</p>
    </div>
</div>

<script>
function executarHomenagem() {
    document.getElementById('resultado').classList.remove('hidden');
    for(let i = 0; i < 30; i++) {
        setTimeout(criarCoracao, i * 100);
    }
}

function criarCoracao() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = Math.random() * 2 + 2 + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
}
</script>

</body>
</html>
